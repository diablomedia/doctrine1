name: BC Check
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  roave_bc_check:
    name: Roave BC Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Roave BC Check
        uses: docker://nyholm/roave-bc-check-ga
        env:
          # Configure Git inside the container, where the checkout has a different owner.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
